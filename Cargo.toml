[package]
name = "voidkit_rust"
version = "0.1.0"
edition = "2021"
authors = ["Justin K. Lietz <justin@neuroca.dev>"]
description = "High-performance Rust implementation of VoidKit math/physics library"
license = "SEE LICENSE IN LICENSE"

[lib]
name = "voidkit_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
# PyO3 for Python bindings
pyo3 = "0.22"
numpy = "0.22"

# Math and scientific computing
nalgebra = "0.33"  # Linear algebra
ndarray = "0.16"   # N-dimensional arrays
num-traits = "0.2"

# Numerical methods
peroxide = "0.37"  # ODE solvers, integration
approx = "0.5"     # Floating point comparisons
rand = "0.9"       # Random number generation
rand_distr = "0.4" # Random distributions

# Graph theory
petgraph = "0.6"   # Graph data structures and algorithms

# Statistics
statrs = "0.17"    # Statistical distributions and functions

[dev-dependencies]
criterion = "0.5"  # Benchmarking
