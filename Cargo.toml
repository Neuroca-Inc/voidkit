[package]
name = "voidkit-rust"
version = "0.1.0"
edition = "2021"
description = "Rust acceleration backend for VoidKit"
authors = ["Justin K. Lietz", "Neuroca, Inc."]
readme = "RUST_README.md"
license = "BSD-3-Clause"
repository = "https://github.com/Neuroca-Inc/voidkit"

[lib]
name = "voidkit_rust"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.22", features = ["auto-initialize"] }
numpy = "0.22"
nalgebra = "0.33"
ndarray = "0.16"
rand = "0.8"
rand_distr = "0.4"
petgraph = "0.6.5"

[dev-dependencies]
approx = "0.5"

[build-dependencies]
pyo3-build-config = "0.22"
