# PEP 621-compliant project metadata and build configuration

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "voidkit"
version = "0.1.0"
description = "VDM-branded centralized Python mathematics toolkit for numerical, dynamical, stochastic, topological, information-theoretic, and specialized research methods."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]
authors = [
    { name = "Justin K. Lietz", email = "justin@neuroca.dev" }
]
urls = { homepage = "https://github.com/justinlietz93/voidkit" }
# Populated by metadata hook or update script
dynamic = []  # ["dependencies", "authors", "urls"]
keywords = ["VDM", "Unified Void Dynamics Model", "void dynamics", "REVGSP", "SIE", "TDA", "mathematics", "physics", "modeling"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
voidkit-apply-revgsp = "voidkit.void_dynamics.apply_revgsp:main"
voidkit-revgsp = "voidkit.void_dynamics.revgsp_formulas:main"
voidkit-sie = "voidkit.void_dynamics.sie_formulas:main"
voidkit-tda = "voidkit.void_dynamics.tda_formulas:main"
voidkit-stats = "voidkit.advanced_math.calculate_descriptive_stats:main"
voidkit-diff = "voidkit.advanced_math.symbolic_differentiation:main"

[project.optional-dependencies]
# Specialist namespaces remain optional so the numerical core stays lightweight.
symbolic = ["sympy>=1.12"]
graphs = ["networkx>=3.0"]
causal = ["statsmodels>=0.14"]
tda = ["ripser>=0.6.8"]
clustering = ["networkx>=3.0", "scikit-learn>=1.3"]
optimization = ["scikit-optimize>=0.10"]
plotting = ["matplotlib>=3.7"]
semantic = ["scikit-learn>=1.3"]
structural = ["networkx>=3.0"]
vdm = ["torch>=2.0"]
all = [
  "sympy>=1.12",
  "networkx>=3.0",
  "statsmodels>=0.14",
  "ripser>=0.6.8",
  "scikit-learn>=1.3",
  "scikit-optimize>=0.10",
  "matplotlib>=3.7",
  "torch>=2.0",
]

# [project.entry-points."hatch.metadata.hooks"]
# voidkit-metadata = "tools.metadata_hooks:VoidkitMetadataHook"

[tool.hatch.build]
# Include only package and essential files
include = [
  "voidkit/**",
  "tools/metadata_hooks.py",
  "README.md",
  "LICENSE",
]
# Exclude any stray/legacy modules that should not ship
exclude = [
  "voidkit/symbolic_differentiation.py",
]

[tool.hatch.build.targets.wheel]
packages = ["voidkit"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.envs.default]
dependencies = [
  "black>=24.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "pytest>=7.0",
]
